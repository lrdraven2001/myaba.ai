# ─────────────────────────────────────────────────────────────────────────────
# Cloud Run service: myaba-api  (the Spring Boot backend)
#
# Deploy:
#   gcloud run services replace deploy/cloud-run-api.yaml --region us-central1
#
# Prereqs (see deploy/DEPLOY.md for the full one-time setup):
#   • Image pushed to Artifact Registry (deploy/build-and-push.sh)
#   • Runtime service account  myaba-api@myapaai.iam.gserviceaccount.com  with:
#       roles/aiplatform.user        (Vertex — Gemini tiers)
#       roles/datastore.user         (Firestore)
#       roles/firebaseauth.admin     (verify ID tokens / set custom claims)
#       roles/dlp.user               (Cloud DLP scrubbing)
#       roles/logging.logWriter
#       roles/run.invoker  ON the aclx-gateway service  (call the IAM-gated ACLX)
#   • ACLX deployed first, so ACLX_GATEWAY_URL below points at its URL.
#     The API authenticates to ACLX with a Google ID token (no VPC connector).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: myaba-api
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle (no always-on cost); cold start ~2-5s on first
        # request after idle. Raise minScale to 1 once traffic justifies it.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
    spec:
      serviceAccountName: myaba-api@myapaai.iam.gserviceaccount.com
      containers:
        - name: api
          image: us-docker.pkg.dev/myapaai/myaba/api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # ── AI: tiered Gemini on Vertex (ADC = runtime service account) ──
            - name: VERTEX_PROJECT_ID
              value: "myapaai"
            - name: GEMINI_LOCATION
              value: "global"
            - name: GEMINI_MODEL_FAST
              value: "gemini-3.1-flash-lite"
            - name: GEMINI_MODEL_REASONING
              value: "gemini-3.1-pro-preview"
            - name: GEMINI_MAX_TOKENS_REASONING
              value: "65535"

            # ── Directory lookup (lookup_place chat tool) ────────────────────
            # PHI-free Places lookup for external entities. Key lives in Secret
            # Manager (places-api-key, restricted to Places API (New)); the
            # myaba-api SA has secretAccessor on it.
            - name: PLACES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: places-api-key
                  key: latest

            # ── Firebase Admin: project only; credentials come from the
            #    runtime service account via ADC (no key file in prod) ────────
            - name: FIREBASE_PROJECT_ID
              value: "myapaai"

            # ── ACLX governance gateway (private — via VPC connector) ────────
            - name: ACLX_ENABLED
              value: "true"
            - name: ACLX_DOMAIN
              value: "hipaa"
            # ACLX gateway (private, IAM-gated). The API sends a Google ID token
            # with this URL as the audience; myaba-api SA has run.invoker on it.
            - name: ACLX_GATEWAY_URL
              value: "https://aclx-gateway-wnvhcl6tqq-uc.a.run.app"

            # ── CORS: same-origin via Firebase Hosting /api rewrite, plus the
            #    apex/app hosts in case the API is also mapped to api.myaba.ai ─
            # Include the Firebase Hosting *.web.app domains (used before the
            # custom domains are mapped) alongside the production custom domains.
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.myaba.ai,https://myaba.ai,https://myaba-app.web.app,https://myaba-ai.web.app,https://admin.myaba.ai,https://myaba-admin.web.app"

            # ── Public app URL — invite links + SSO callback are built on this.
            #    Without it the code default is http://localhost:5173. ──────────
            - name: APP_BASE_URL
              value: "https://app.myaba.ai"

            # ── Platform-admin tier: vendor operator emails for /api/platform
            #    (the admin.myaba.ai console). Comma-separated, case-insensitive,
            #    fails closed when empty. NOT a customer role. Lives here (not a
            #    hand-set env var) because CI deploys with `services replace`,
            #    which would wipe anything not in this file. ─────────────────────
            - name: PLATFORM_ADMIN_EMAILS
              value: "chris@cbhunt.net"

            # NOTE: FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST are
            # intentionally ABSENT — their presence would route to the emulator.
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 20
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
