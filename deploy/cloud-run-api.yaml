# ─────────────────────────────────────────────────────────────────────────────
# Cloud Run service: myaba-api  (the Spring Boot backend)
#
# Deploy:
#   gcloud run services replace deploy/cloud-run-api.yaml --region us-central1
#
# Prereqs (see deploy/DEPLOY.md for the full one-time setup):
#   • Image pushed to Artifact Registry (deploy/build-and-push.sh)
#   • Runtime service account  myaba-api@myapaai.iam.gserviceaccount.com  with:
#       roles/aiplatform.user        (Vertex — Gemini tiers)
#       roles/datastore.user         (Firestore)
#       roles/firebaseauth.admin     (verify ID tokens / set custom claims)
#       roles/dlp.user               (Cloud DLP scrubbing)
#       roles/logging.logWriter
#       roles/run.invoker  ON the aclx-gateway service  (call the IAM-gated ACLX)
#   • ACLX deployed first, so ACLX_GATEWAY_URL below points at its URL.
#     The API authenticates to ACLX with a Google ID token (no VPC connector).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: myaba-api
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle (no always-on cost); cold start ~2-5s on first
        # request after idle. Raise minScale to 1 once traffic justifies it.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        # CPU always allocated (not throttled to request scope). REQUIRED for the
        # async document-extraction worker (ExtractionJobService): the background
        # OCR/vision extraction runs AFTER the HTTP response returns, so without
        # this the worker is throttled and jobs never leave PROCESSING. Still
        # scales to zero when idle with no in-flight work.
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: myaba-api@myapaai.iam.gserviceaccount.com
      containers:
        - name: api
          image: us-docker.pkg.dev/myapaai/myaba/api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # ── Cold-start trim (free) ───────────────────────────────────────
            # Stop JIT at C1 (skip the C2 optimizing compiler) so the JVM spends
            # less CPU compiling during boot → faster time-to-ready on a cold
            # container. Steady-state impact is negligible here: the hot paths
            # (Vertex/Gemini, Firestore, ACLX, extraction) are network/IO-bound,
            # not CPU-JIT-bound. Remove this value to restore full C2 if a future
            # CPU-heavy in-process workload needs peak throughput.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:TieredStopAtLevel=1"

            # ── AI: tiered Gemini on Vertex (ADC = runtime service account) ──
            - name: VERTEX_PROJECT_ID
              value: "myapaai"
            - name: GEMINI_LOCATION
              value: "global"
            - name: GEMINI_MODEL_FAST
              value: "gemini-3.5-flash-lite"
            - name: GEMINI_MODEL_REASONING
              value: "gemini-3.1-pro-preview"
            - name: GEMINI_MAX_TOKENS_REASONING
              value: "65535"

            # ── Document translation (Cloud Translation Advanced v3) ─────────
            # Layout-preserving docx/pdf translation for client documents.
            # Uses VERTEX_PROJECT_ID above + the runtime SA (needs
            # roles/cloudtranslate.user; the translate.googleapis.com API must
            # be enabled). Regional endpoint derived from this location.
            - name: TRANSLATE_LOCATION
              value: "us-central1"

            # ── Directory lookup (lookup_place chat tool) ────────────────────
            # PHI-free Places lookup for external entities. Key lives in Secret
            # Manager (places-api-key, restricted to Places API (New)); the
            # myaba-api SA has secretAccessor on it.
            - name: PLACES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: places-api-key
                  key: latest

            # ── Web research (research_web chat tool) ────────────────────────
            # Search-grounded Gemini call carrying only the guarded question —
            # payer policies, Medicaid rules, district procedures. No key
            # needed; billed per grounded query on Vertex.
            - name: RESEARCH_LOOKUP_ENABLED
              value: "true"

            # ── Firebase Admin: project only; credentials come from the
            #    runtime service account via ADC (no key file in prod) ────────
            - name: FIREBASE_PROJECT_ID
              value: "myapaai"

            # ── ACLX governance gateway (private — via VPC connector) ────────
            - name: ACLX_ENABLED
              value: "true"
            - name: ACLX_DOMAIN
              value: "hipaa"
            # ACLX gateway (private, IAM-gated). The API sends a Google ID token
            # with this URL as the audience; myaba-api SA has run.invoker on it.
            - name: ACLX_GATEWAY_URL
              value: "https://aclx-gateway-wnvhcl6tqq-uc.a.run.app"

            # ── CORS: same-origin via Firebase Hosting /api rewrite, plus the
            #    apex/app hosts in case the API is also mapped to api.myaba.ai ─
            # Include the Firebase Hosting *.web.app domains (used before the
            # custom domains are mapped) alongside the production custom domains.
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.myaba.ai,https://myaba.ai,https://myaba-app.web.app,https://myaba-ai.web.app,https://admin.myaba.ai,https://myaba-admin.web.app"

            # ── Public app URL — invite links + SSO callback are built on this.
            #    Without it the code default is http://localhost:5173. ──────────
            - name: APP_BASE_URL
              value: "https://app.myaba.ai"

            # ── Platform-admin tier: vendor operator emails for /api/platform
            #    (the admin.myaba.ai console). Comma-separated, case-insensitive,
            #    fails closed when empty. NOT a customer role. Lives here (not a
            #    hand-set env var) because CI deploys with `services replace`,
            #    which would wipe anything not in this file. ─────────────────────
            - name: PLATFORM_ADMIN_EMAILS
              value: "chris@cbhunt.net"

            # ── Stripe subscription billing ─────────────────────────────────
            # ⚠ Create BOTH secrets in Secret Manager BEFORE pushing this file —
            #   a secretKeyRef to a missing secret makes `services replace` FAIL:
            #     printf '%s' 'sk_live_…' | gcloud secrets create stripe-secret-key     --data-file=- --project myapaai
            #     printf '%s' 'whsec_…'   | gcloud secrets create stripe-webhook-secret --data-file=- --project myapaai
            #   then grant the runtime SA secretAccessor on each (see deploy notes).
            # Until STRIPE_SECRET_KEY resolves, BillingService stays DISABLED and
            # the app runs normally. Prices are non-secret Stripe Price IDs from
            # Product catalog (monthly recurring); enterprise = contact-sales (unset).
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret-key
                  key: latest
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-webhook-secret
                  key: latest
            - name: STRIPE_PRICE_SOLO
              value: "price_1Tz6VBD25u0E4OT7DnY5nCBR"
            - name: STRIPE_PRICE_TEAM
              value: "price_1Tz7G4D25u0E4OT7fHMGIJM8"

            # ── Plan usage caps (monthly AI requests; -1 = unlimited) ────────
            # Solo: flat $50/mo, 200 req/mo. Team: $35/seat — TEAM IS PER-SEAT:
            # this value is the per-seat cap, and the effective org ceiling is
            # 500 × paid seats (UsageService scales it from the Stripe quantity).
            - name: USAGE_LIMIT_SOLO
              value: "200"
            - name: USAGE_LIMIT_TEAM
              value: "500"
            # Checkout/portal return URLs default to https://app.myaba.ai/settings?tab=billing
            # (application.yml). Add STRIPE_CHECKOUT_SUCCESS_URL / _CANCEL_URL /
            # STRIPE_PORTAL_RETURN_URL here only to override those defaults.

            # ── SMTP email (org / team invitations) ──────────────────────────
            # Google Workspace SMTP. MAIL_PASSWORD is a Google APP PASSWORD (16
            # chars; requires 2-Step Verification on register@myaba.ai) stored in
            # the mail-password Secret Manager secret — a normal account password
            # is REJECTED by Gmail SMTP. The secret must exist before this file is
            # pushed (a missing secretKeyRef fails `services replace`). Lives here,
            # not a hand-set env var, so CI's `services replace` doesn't wipe it.
            # EmailService disables itself if MAIL_HOST is unset (invites then fall
            # back to "copy the link" instead of sending).
            - name: MAIL_HOST
              value: "smtp.gmail.com"
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_USERNAME
              value: "register@myaba.ai"
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-password
                  key: latest
            - name: APP_MAIL_FROM
              value: "register@myaba.ai"

            # NOTE: FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST are
            # intentionally ABSENT — their presence would route to the emulator.
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 20
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
