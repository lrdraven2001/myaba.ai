# ─────────────────────────────────────────────────────────────────────────────
# Cloud Run service: aclx-gateway  (governance gateway + OPA sidecar) for myABA
#
# PRIVATE via IAM: ingress=all but invoker-restricted — only callers granted
# roles/run.invoker (the myaba-api service account) can reach it; the API sends a
# Google ID token. No VPC connector required (keeps idle cost at zero).
#
# Deploy:
#   gcloud run services replace deploy/cloud-run-aclx.yaml --region us-central1
#
# Prereqs (see deploy/DEPLOY.md):
#   • Images pushed:  us-docker.pkg.dev/myapaai/aclx/{gateway-api,opa}:latest
#   • Secret  aclx-signing-key  in Secret Manager (persistent label-signing key)
#   • Runtime SA  aclx-gateway@myapaai.iam  with roles/aiplatform.user
#     (Gemini), roles/secretmanager.secretAccessor, roles/logging.logWriter
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aclx-gateway
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    # Reachable over its URL but IAM-gated: only callers granted run.invoker
    # (the myaba-api service account) can invoke it. No VPC required.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle; cold start ~2-5s on first request after idle.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/container-dependencies: '{"gateway-api":["opa"]}'
    spec:
      serviceAccountName: aclx-gateway@myapaai.iam.gserviceaccount.com
      containers:

        # ── Ingress container: the ACLX gateway ──────────────────────────────
        - name: gateway-api
          image: us-docker.pkg.dev/myapaai/aclx/gateway-api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "ACLX Gateway API"
            - name: OPA_URL
              value: "http://localhost:8181"
            - name: OPA_FAIL_CLOSED
              value: "true"
            - name: AUDIT_MODE
              value: "cloud_logging"
            - name: SEMANTIC_DETECTOR_ENABLED
              value: "true"
            - name: NARRATIVE_RENDERER_ENABLED
              value: "true"
            - name: LABEL_SIGNING_ENABLED
              value: "true"

            # ── LLM: Gemini 3.1 Flash-Lite on Vertex (ADC = runtime SA) ──────
            - name: LLM_PROVIDER
              value: "gemini"
            - name: VERTEX_PROJECT
              value: "myapaai"
            - name: GCP_PROJECT_ID
              value: "myapaai"
            - name: GEMINI_LOCATION
              value: "global"
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash-lite"
            # Semantic detector runs on a stronger model to avoid false-positive
            # redaction of clinical ABA terminology (DRA, extinction, FCT, …).
            - name: SEMANTIC_DETECTOR_MODEL
              value: "gemini-3.5-flash"
            # Groundedness (faithfulness) checker must NOT fall back to the shared
            # flash-lite model — full Flash was tuned to stop over-flagging clinical
            # source-internal inconsistencies as hallucinations. Pin it explicitly.
            - name: GROUNDEDNESS_MODEL
              value: "gemini-3.5-flash"

            # Cloud DLP optional (myABA's own API already scrubs); off here.
            - name: ENABLE_CLOUD_DLP
              value: "false"

            # Persistent signing key — required so labels signed by one instance
            # verify on another (mandatory when maxScale > 1).
            - name: SIGNING_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: aclx-signing-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 10
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2

        # ── Sidecar: OPA with policies baked into the image ──────────────────
        - name: opa
          image: us-docker.pkg.dev/myapaai/aclx/opa:latest
          resources:
            limits:
              cpu: "1"
              memory: "256Mi"
          startupProbe:
            tcpSocket:
              port: 8181
            failureThreshold: 10
            periodSeconds: 3
            timeoutSeconds: 2
  traffic:
    - percent: 100
      latestRevision: true
