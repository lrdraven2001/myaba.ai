server:
  port: ${PORT:9090}

spring:
  application:
    name: myaba-api
  jackson:
    default-property-inclusion: non_null
  # Allow Excel/CSV uploads up to 25 MB (OfficePuzzle exports are typically <2 MB)
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 26MB

# ── AI Provider ────────────────────────────────────────────────────────────
# ai.provider=vertex    → Claude via Vertex AI (uses Google ADC, no API key)
# ai.provider=gemini    → Gemini via Vertex AI (uses Google ADC, no API key)
# ai.provider=anthropic → Anthropic direct (local dev; requires ANTHROPIC_API_KEY)
#
# In production on Cloud Run, set AI_PROVIDER in env vars.
# Vertex AI (vertex/gemini) is covered by the Google Cloud BAA — no separate Anthropic BAA needed.
ai:
  provider: ${AI_PROVIDER:gemini}

# ── Anthropic direct (local dev only) ─────────────────────────────────────
# Only used when ai.provider=anthropic.
# Set ANTHROPIC_API_KEY in .env (gitignored). Never commit a real key.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com
  max-tokens: 4000

# ── Vertex AI (production / HIPAA BAA path) ───────────────────────────────
# Only used when ai.provider=vertex.
# Authentication is via Application Default Credentials (ADC):
#   - Cloud Run: service account attached to the revision (no env vars needed)
#   - Local dev: run `gcloud auth application-default login` once
#
# Required IAM role on the service account: roles/aiplatform.user
#
# Find current model names at:
#   GCP Console → Vertex AI → Model Garden → Anthropic Claude → View details
vertex:
  project-id: ${VERTEX_PROJECT_ID:}
  location:   ${VERTEX_LOCATION:us-east5}
  # Model name in Vertex "publisher/model@version" format.
  # Update this when Anthropic releases new model versions in Model Garden.
  model:      ${VERTEX_MODEL:claude-sonnet-4@20250514}

# ── Gemini via Vertex AI ──────────────────────────────────────────────────
# Only used when ai.provider=gemini. Same GCP project / ADC as vertex, but a
# DIFFERENT region. Must be a concrete region (e.g. us-central1) or "global" —
# the "us"/"eu" multi-region values are NOT valid Vertex hostnames. Gemini is
# NOT served from Anthropic's "us-east5". us-central1 keeps data in the US.
# Model names: GCP Console → Vertex AI → Model Garden → Gemini.
gemini:
  location: ${GEMINI_LOCATION:global}
  model:    ${GEMINI_MODEL:gemini-2.5-flash}        # legacy single-model fallback
  # Tiered models: fast (chat + light docs) vs reasoning (signable clinical documents).
  model-fast:      ${GEMINI_MODEL_FAST:gemini-3.1-flash-lite}
  model-reasoning: ${GEMINI_MODEL_REASONING:gemini-2.5-pro}
  max-tokens-reasoning: ${GEMINI_MAX_TOKENS_REASONING:32768}

# ── ACLX Gateway ──────────────────────────────────────────────────────────
aclx:
  gateway-url: ${ACLX_GATEWAY_URL:http://localhost:8080}
  enabled: ${ACLX_ENABLED:true}
  timeout-ms: 5000
  # Enforcement domain — governs which Rego policy bundle ACLX applies.
  # Supported: hipaa (default for ABA), cui, ip, enterprise, mixed.
  # Override with ACLX_DOMAIN env var for multi-tenant deployments that
  # need a different domain per deployment unit.
  domain: ${ACLX_DOMAIN:hipaa}
  # Per-domain hard-block rules.
  # hard-block-scopes:             data scope strings that require explicit authorization
  # hard-block-auth-types:         authorization types that satisfy the requirement
  # hard-block-diagnosis-keywords: subject-record keywords that flag a hard-block scope
  domains:
    hipaa:
      hard-block-scopes:
        - SUD
        - PSYCHOTHERAPY
        - HIV
        - GENETIC
      hard-block-auth-types:
        - ABA_TREATMENT_AUTHORIZATION
        - PART_2_CONSENT
        - PART_2_COURT_ORDER
        - HIPAA_AUTHORIZATION
        - PSYCHOTHERAPY_AUTHORIZATION
        - HIV_STATE_CONSENT
      hard-block-diagnosis-keywords:
        - substance use
        - substance abuse
        - sud
        - alcohol use disorder
        - opioid use
        - psychotherapy
        - hiv
        - genetic

# ── Firebase ──────────────────────────────────────────────────────────────
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  # Path to service account JSON file — used locally.
  # On Cloud Run, set GOOGLE_APPLICATION_CREDENTIALS or use Workload Identity.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  # Alternatively supply credentials inline (for Cloud Run env vars)
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  private-key: ${FIREBASE_PRIVATE_KEY:}

# ── CORS ──────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Usage limits ──────────────────────────────────────────────────────────
# Monthly AI request limits by plan. -1 means unlimited.
# Override per environment via USAGE_LIMIT_SOLO / TEAM / ENTERPRISE env vars.
usage:
  limits:
    solo:       ${USAGE_LIMIT_SOLO:200}
    team:       ${USAGE_LIMIT_TEAM:2000}
    enterprise: ${USAGE_LIMIT_ENTERPRISE:-1}

# ── EHR Integrations ──────────────────────────────────────────────────────
# AES-256 key for encrypting EHR credentials at rest in Firestore.
# Generate with: openssl rand -base64 32
# Set EHR_CREDENTIAL_KEY in production — never commit a real key.
ehr:
  credential-key: ${EHR_CREDENTIAL_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  centralreach:
    base-url: ${EHR_CENTRALREACH_BASE_URL:https://{subdomain}.centralreach.com/api/v2}
  rethink:
    base-url: ${EHR_RETHINK_BASE_URL:https://api.rethinkfirst.com/v1}

# ── DLP (Data Loss Prevention) ────────────────────────────────────────────
# Controls which non-clinical identifier patterns are blocked before input
# reaches the AI.  Clinical PHI (names, DOBs, diagnoses) is allowed through
# so responses remain coherent.  Each toggle can be set via env var.
dlp:
  enabled:          ${DLP_ENABLED:true}
  ssn:              ${DLP_BLOCK_SSN:true}
  payment-cards:    ${DLP_BLOCK_PAYMENT_CARDS:true}
  drivers-license:  ${DLP_BLOCK_DRIVERS_LICENSE:true}

# ── Rate limiting ─────────────────────────────────────────────────────────
# Token-bucket rate limiting applied after Firebase authentication.
# Requests over the per-minute limits receive HTTP 429 with Retry-After: 60.
# Set RATE_LIMIT_ENABLED=false to disable entirely (e.g. performance testing).
rate-limit:
  enabled:                   ${RATE_LIMIT_ENABLED:true}
  ip.requests-per-minute:    ${RATE_LIMIT_IP_RPM:300}
  user.requests-per-minute:  ${RATE_LIMIT_USER_RPM:60}

# ── Data retention ────────────────────────────────────────────────────────
# Audit log records older than retention.audit-log-days are purged nightly
# at 02:15 UTC by DataRetentionService.
# Default: 2555 days (7 years) — exceeds HIPAA's 6-year minimum and aligns
# with the proposed 2025 HIPAA Security Rule documentation requirements.
retention:
  audit-log-days: ${RETENTION_AUDIT_LOG_DAYS:2555}

# ── Dev mode ──────────────────────────────────────────────────────────────
# Set DEV_AUTH=true to skip Firebase token verification and use a stub user.
# NEVER enable in production.
dev:
  auth-enabled: ${DEV_AUTH:false}
