server:
  port: ${PORT:9090}

spring:
  application:
    name: myaba-api
  jackson:
    default-property-inclusion: non_null
  # Allow Excel/CSV uploads up to 25 MB (OfficePuzzle exports are typically <2 MB)
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 26MB
  # ── Email (invitations) — SMTP via any provider (SendGrid, SES, Mailgun, Gmail).
  # Leave MAIL_HOST unset → email is DISABLED and invite endpoints report
  # "not configured" (never a silent no-op). For SendGrid: host=smtp.sendgrid.net,
  # username=apikey, password=<the API key>.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

# App-level settings (single top-level `app:` block — duplicate keys break the
# Spring Boot YAML loader). Outbound-invite email identity + public app URL.
app:
  # From address / display name for outbound invitation emails.
  mail:
    from:      ${MAIL_FROM:no-reply@myaba.ai}
    from-name: ${MAIL_FROM_NAME:myABA.ai}
  # Public URL of the customer app — used to build invite links and the SSO
  # callback. MUST be set in production (deploy/cloud-run-api.yaml sets
  # APP_BASE_URL=https://app.myaba.ai) or invites point at localhost.
  base-url:  ${APP_BASE_URL:http://localhost:5173}

# ── AI: Gemini via Vertex AI ──────────────────────────────────────────────
# Gemini is the only model provider. It runs on Vertex AI under the project's
# service account (Application Default Credentials — no API key) and is covered
# by the Google Cloud BAA. Required IAM role on the SA: roles/aiplatform.user.
#   - Cloud Run: service account attached to the revision
#   - Local dev: run `gcloud auth application-default login` once

# GCP project for Vertex AI (serves Gemini). Set via VERTEX_PROJECT_ID on Cloud Run.
vertex:
  project-id: ${VERTEX_PROJECT_ID:}

# Gemini location must be a concrete region (e.g. us-central1) or "global" — the
# "us"/"eu" multi-region values are NOT valid Vertex hostnames. us-central1 keeps
# data in the US. Model names: GCP Console → Vertex AI → Model Garden → Gemini.
gemini:
  location: ${GEMINI_LOCATION:global}
  model:    ${GEMINI_MODEL:gemini-3.5-flash}        # legacy single-model fallback
  max-tokens: ${GEMINI_MAX_TOKENS:4000}
  # Tiered models: fast (general/non-client chat) vs reasoning (all document
  # building + client-attached chat).
  model-fast:      ${GEMINI_MODEL_FAST:gemini-3.5-flash-lite}
  model-reasoning: ${GEMINI_MODEL_REASONING:gemini-3.1-pro-preview}
  max-tokens-reasoning: ${GEMINI_MAX_TOKENS_REASONING:65535}

# ── Directory lookup (Google Places) ──────────────────────────────────────
# PHI-free lookup_place chat tool: current address/phone/website of external
# entities (schools, clinics, payers). Only the guarded entity name + org
# locality ever leave the platform. Feature is OFF while the key is blank.
places:
  api-key: ${PLACES_API_KEY:}

# ── Web research (research_web chat tool) ─────────────────────────────────
# PHI-free search-grounded lookups (payer policies, Medicaid rules, district
# procedures) via a separate Gemini googleSearch call carrying only the
# guarded question. No API key needed (billed per grounded query on Vertex).
lookup:
  research-enabled: ${RESEARCH_LOOKUP_ENABLED:false}

# ── ACLX Gateway ──────────────────────────────────────────────────────────
aclx:
  gateway-url: ${ACLX_GATEWAY_URL:http://localhost:8080}
  enabled: ${ACLX_ENABLED:true}
  timeout-ms: 5000
  # Enforcement domain — governs which Rego policy bundle ACLX applies.
  # Supported: hipaa (default for ABA), cui, ip, enterprise, mixed.
  # Override with ACLX_DOMAIN env var for multi-tenant deployments that
  # need a different domain per deployment unit.
  domain: ${ACLX_DOMAIN:hipaa}
  # Per-domain hard-block rules.
  # hard-block-scopes:             data scope strings that require explicit authorization
  # hard-block-auth-types:         authorization types that satisfy the requirement
  # hard-block-diagnosis-keywords: subject-record keywords that flag a hard-block scope
  domains:
    hipaa:
      hard-block-scopes:
        - SUD
        - PSYCHOTHERAPY
        - HIV
        - GENETIC
      hard-block-auth-types:
        - ABA_TREATMENT_AUTHORIZATION
        - PART_2_CONSENT
        - PART_2_COURT_ORDER
        - HIPAA_AUTHORIZATION
        - PSYCHOTHERAPY_AUTHORIZATION
        - HIV_STATE_CONSENT
      hard-block-diagnosis-keywords:
        - substance use
        - substance abuse
        - sud
        - alcohol use disorder
        - opioid use
        - psychotherapy
        - hiv
        - genetic

# ── Firebase ──────────────────────────────────────────────────────────────
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  # Path to service account JSON file — used locally.
  # On Cloud Run, set GOOGLE_APPLICATION_CREDENTIALS or use Workload Identity.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  # Alternatively supply credentials inline (for Cloud Run env vars)
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  private-key: ${FIREBASE_PRIVATE_KEY:}

# ── Document storage (Google Cloud Storage) ───────────────────────────────
# Original uploaded files are stored in GCS; extracted text stays in Firestore
# (that feeds the auto-reuse / chat-context pipeline). When GCS_DOCUMENTS_BUCKET
# is unset the app runs normally — originals are simply not stored and the
# "download original" action is hidden. The bucket, IAM, and CMEK are provisioned
# MANUALLY in GCP (see the setup checklist), not by application code.
#   kms-key                 – optional CMEK resource name applied on write; empty
#                             uses the bucket's default (Google-managed or bucket CMEK).
#   signed-url-ttl-minutes  – lifetime of download signed URLs.
gcs:
  documents-bucket:       ${GCS_DOCUMENTS_BUCKET:}
  kms-key:                ${GCS_KMS_KEY:}
  signed-url-ttl-minutes: ${GCS_SIGNED_URL_TTL_MINUTES:10}

# ── Billing (Stripe) ──────────────────────────────────────────────────────
# Real monthly subscription billing via Stripe Checkout (card capture) + Billing
# Portal (plan/payment management). Card data never touches our servers.
# All values are env-driven with EMPTY defaults — when STRIPE_SECRET_KEY is unset
# the billing endpoints are DISABLED (fail-graceful), exactly like GCS. Keys,
# prices, and the webhook secret are provisioned MANUALLY in the Stripe dashboard
# (see the setup checklist), never committed. Price IDs map the existing plan
# tiers to monthly recurring Stripe Prices; enterprise may be left unset
# (contact-sales) and is handled gracefully.
stripe:
  secret-key:     ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  prices:
    solo:       ${STRIPE_PRICE_SOLO:}
    team:       ${STRIPE_PRICE_TEAM:}
    enterprise: ${STRIPE_PRICE_ENTERPRISE:}
  # Where Stripe redirects back to after Checkout / Billing Portal — the app's
  # Billing & Usage tab.
  checkout-success-url: ${STRIPE_CHECKOUT_SUCCESS_URL:https://app.myaba.ai/settings?tab=billing&checkout=success}
  checkout-cancel-url:  ${STRIPE_CHECKOUT_CANCEL_URL:https://app.myaba.ai/settings?tab=billing&checkout=cancel}
  portal-return-url:    ${STRIPE_PORTAL_RETURN_URL:https://app.myaba.ai/settings?tab=billing}

# ── Session ────────────────────────────────────────────────────────────────
# Absolute session cap: force re-authentication this many hours after the user's
# original sign-in, regardless of Firebase's silent hourly token refresh. 0 disables.
# Server-enforced ceiling that complements the client-side inactivity auto-logoff.
auth:
  max-session-hours: ${AUTH_MAX_SESSION_HOURS:12}

# ── CORS ──────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Usage limits ──────────────────────────────────────────────────────────
# Monthly AI request limits by plan. -1 means unlimited.
# Override per environment via USAGE_LIMIT_SOLO / TEAM / ENTERPRISE env vars.
usage:
  limits:
    # Free / lapsed tier — applied when a billed org's subscription is past_due,
    # canceled, or unpaid (Stripe is source of truth). Never-subscribed orgs keep
    # their existing plan behaviour unchanged.
    free:       ${USAGE_LIMIT_FREE:20}
    solo:       ${USAGE_LIMIT_SOLO:200}
    # Team is billed per seat → this is the PER-SEAT cap; the effective org
    # ceiling is team × paid seats (e.g. 500 × 5 = 2,500 for a 5-seat team).
    team:       ${USAGE_LIMIT_TEAM:500}
    enterprise: ${USAGE_LIMIT_ENTERPRISE:-1}

# ── EHR Integrations ──────────────────────────────────────────────────────
# AES-256 key for encrypting EHR credentials at rest in Firestore.
# Generate with: openssl rand -base64 32
# Set EHR_CREDENTIAL_KEY in production — never commit a real key.
ehr:
  credential-key: ${EHR_CREDENTIAL_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  centralreach:
    base-url: ${EHR_CENTRALREACH_BASE_URL:https://{subdomain}.centralreach.com/api/v2}
  rethink:
    base-url: ${EHR_RETHINK_BASE_URL:https://api.rethinkfirst.com/v1}

# ── DLP (Data Loss Prevention) ────────────────────────────────────────────
# Controls which non-clinical identifier patterns are blocked before input
# reaches the AI.  Clinical PHI (names, DOBs, diagnoses) is allowed through
# so responses remain coherent.  Each toggle can be set via env var.
dlp:
  enabled:          ${DLP_ENABLED:true}
  ssn:              ${DLP_BLOCK_SSN:true}
  payment-cards:    ${DLP_BLOCK_PAYMENT_CARDS:true}
  drivers-license:  ${DLP_BLOCK_DRIVERS_LICENSE:true}

# ── Rate limiting ─────────────────────────────────────────────────────────
# Token-bucket rate limiting applied after Firebase authentication.
# Requests over the per-minute limits receive HTTP 429 with Retry-After: 60.
# Set RATE_LIMIT_ENABLED=false to disable entirely (e.g. performance testing).
rate-limit:
  enabled:                   ${RATE_LIMIT_ENABLED:true}
  ip.requests-per-minute:    ${RATE_LIMIT_IP_RPM:300}
  user.requests-per-minute:  ${RATE_LIMIT_USER_RPM:60}

# ── Data retention ────────────────────────────────────────────────────────
# Audit log records older than retention.audit-log-days are purged nightly
# at 02:15 UTC by DataRetentionService.
# Default: 2555 days (7 years) — exceeds HIPAA's 6-year minimum and aligns
# with the proposed 2025 HIPAA Security Rule documentation requirements.
retention:
  audit-log-days: ${RETENTION_AUDIT_LOG_DAYS:2555}

# ── Platform admin (vendor tier) ──────────────────────────────────────────
# Comma-separated emails of vendor operators allowed to use /api/platform
# (the admin.myaba.ai console). This is a SEPARATE tier from customer roles —
# ORG_SUPER_ADMIN does NOT grant platform access. Fails closed when unset.
#   gcloud run services update myaba-api \
#     --update-env-vars PLATFORM_ADMIN_EMAILS=chris@cbhunt.net
platform:
  admin-emails: ${PLATFORM_ADMIN_EMAILS:}

# ── Dev mode ──────────────────────────────────────────────────────────────
# Set DEV_AUTH=true to skip Firebase token verification and use a stub user.
# NEVER enable in production.
dev:
  auth-enabled: ${DEV_AUTH:false}
